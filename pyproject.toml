[project]
name = "ankindle"
version = "0.1.0"
description = "Command line tool that turns Kindle word lookups into Anki cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anki==26.8.1",
    "platformdirs==4.11.7",
    "pytest==9.1.1",
    "requests==2.34.2",
    "simplemma==2.0.0",
]

[project.scripts]
ankindle = "ankindle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ankindle"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not live'"
markers = [
    "live: hits a real network service; deselected by default, run with -m live",
]
